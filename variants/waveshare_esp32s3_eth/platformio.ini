; Waveshare ESP32-S3-ETH (onboard W5500 SPI Ethernet, optional PoE module)
; paired with an external Waveshare Core1262 (SX1262) LoRa module.
; https://www.waveshare.com/wiki/ESP32-S3-ETH
; See README.md in this folder for the wiring table.

[waveshare_esp32s3_eth]
extends = esp32_base
; the onboard W5500 (SPI Ethernet) requires ETH.h from arduino-esp32 3.x,
; so this variant uses the pioarduino platform (same as esp32c6_base)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/waveshare_esp32s3_eth
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D DISABLE_WIFI_OTA=1
; SX1262 (Core1262) wired to spare header GPIOs (camera/TF pins stay free)
  -D P_LORA_SCLK=38
  -D P_LORA_MISO=39
  -D P_LORA_MOSI=40
  -D P_LORA_NSS=41
  -D P_LORA_RESET=42
  -D P_LORA_BUSY=47
  -D P_LORA_DIO_1=17
  -D SX126X_RXEN=15
  -D SX126X_DIO2_AS_RF_SWITCH=true ; module TXEN jumpered to DIO2
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_NEOPIXEL_LED=21 ; onboard WS2812
; I2C on free header pins (S3 defaults SDA=8/SCL=9 would clash with the W5500)
  -D PIN_BOARD_SDA=16
  -D PIN_BOARD_SCL=18
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/waveshare_esp32s3_eth>

; onboard W5500 Ethernet (fixed by board layout, do not change).
; Uses arduino-esp32 3.x native ETH.h support (see W5500EthernetInterface).
[waveshare_esp32s3_eth_ethernet]
build_flags =
  -D ETHERNET_ENABLED
  -D ETHERNET_USE_W5500
  -D ETHERNET_CLASS=W5500EthernetInterface
  -D ETH_CS_PIN=14
  -D ETH_INT_PIN=10
  -D ETH_RST_PIN=9
  -D ETH_SCLK_PIN=13
  -D ETH_MISO_PIN=12
  -D ETH_MOSI_PIN=11
  -D ETHERNET_DEBUG_LOGGING=1
; static IP instead of DHCP: uncomment and adjust (comma-separated octets, no quotes)
;  -D ETHERNET_STATIC_IP=192,168,1,60
;  -D ETHERNET_STATIC_GATEWAY=192,168,1,1
;  -D ETHERNET_STATIC_SUBNET=255,255,255,0
;  -D ETHERNET_STATIC_DNS=192,168,1,1
build_src_filter =
  +<helpers/ethernet/*.cpp>
  +<helpers/ethernet/w5500/>

[env:waveshare_esp32s3_eth_companion_radio_eth]
extends = waveshare_esp32s3_eth
build_flags = ${waveshare_esp32s3_eth.build_flags}
  ${waveshare_esp32s3_eth_ethernet.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${waveshare_esp32s3_eth.build_src_filter}
  ${waveshare_esp32s3_eth_ethernet.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${waveshare_esp32s3_eth.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:waveshare_esp32s3_eth_repeater]
extends = waveshare_esp32s3_eth
build_flags = ${waveshare_esp32s3_eth.build_flags}
  -D ADVERT_NAME='"S3-ETH Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${waveshare_esp32s3_eth.build_src_filter}
  +<../examples/simple_repeater>

[env:waveshare_esp32s3_eth_room_server]
extends = waveshare_esp32s3_eth
build_flags = ${waveshare_esp32s3_eth.build_flags}
  -D ADVERT_NAME='"S3-ETH Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${waveshare_esp32s3_eth.build_src_filter}
  +<../examples/simple_room_server>
