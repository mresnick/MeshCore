; RAK19007 base board + RAK4631 core + RAK13302 (SX1262 + SKY66122 1W FEM).
;
; The RAK13302 in the WisBlock IO slot is the radio; the SX1262 built into the
; RAK4630 stamp is unused and gets parked in SLEEP at boot by
; RAK4631_13302Board::begin(), which is the only real difference from running
; the RAK_3401_* firmware on this hardware.
;
; NOTE: the IO slot is taken by the RAK13302, so the WisBlock IO-slot modules
; (RAK13800 ethernet, RAK1910/RAK12500 GPS on IO) cannot be used here - hence
; no ethernet/bridge environments, and RAK_BOARD is deliberately left undefined
; so the RAK GPS probe never toggles WB_IO4/WB_IO5 (the RAK13302's RESET/BUSY).

[rak4631_13302]
extends = nrf52_base
board = rak4631
board_check = true
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak4631_13302
  -D RAK_4631
  -D RAK_4631_13302
  -D NRF52_POWER_MANAGEMENT
  ; The RAK13302 uses WB_IO5/WB_IO6 (P0.09/P0.10) for BUSY/DIO1, which are the
  ; nRF52840's NFC pins. The RAK bootloader normally clears UICR->NFCPINS
  ; already; this makes the firmware set it itself if it finds it unset (a
  ; one-time UICR write plus reset at first boot).
  -D CONFIG_NFCT_PINS_AS_GPIOS
  -D PIN_BOARD_SCL=14
  -D PIN_BOARD_SDA=13
  -D PIN_GPS_TX=PIN_SERIAL1_RX
  -D PIN_GPS_RX=PIN_SERIAL1_TX
  -D PIN_GPS_EN=-1
  -D PIN_OLED_RESET=-1
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX with SKY66122 FEM
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak4631_13302>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27

[env:RAK_4631_13302_repeater]
extends = rak4631_13302
build_flags =
  ${rak4631_13302.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK4631 1W Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rak4631_13302.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>

[env:RAK_4631_13302_room_server]
extends = rak4631_13302
build_flags =
  ${rak4631_13302.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Test Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rak4631_13302.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>

[env:RAK_4631_13302_companion_radio_usb]
extends = rak4631_13302
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak4631_13302.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${rak4631_13302.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak4631_13302.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_4631_13302_companion_radio_ble]
extends = rak4631_13302
